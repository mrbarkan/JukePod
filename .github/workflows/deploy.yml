# Builds the site and publishes it to GitHub Pages.
#   - on every push to main
#   - every night, after refreshing versions, dates and stars from GitHub
#   - by hand from the Actions tab
# The nightly run also emails release alerts to people who asked for them,
# if the BREVO_API_KEY and FIREBASE_SERVICE_ACCOUNT secrets are set.
#
# Needs one setting: Settings > Pages > Source = "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test release alert for this listing id (e.g. rockpod) to admins who signed up"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Refresh versions and stars
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src/data/github-stats.json "$RUNNER_TEMP/stats-before.json"
          npm run refresh
          if ! git diff --quiet -- src/data/github-stats.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh versions and stars" -- src/data/github-stats.json
            git push
          fi

      # Listings and fixes approved from suggestions, or published by trusted
      # contributors. Kept in git, so every change to the site has a commit.
      - name: Publish community listings
        if: github.event_name != 'push'
        run: |
          npm run refresh:community
          if ! git diff --quiet -- src/data/community.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish community listings" -- src/data/community.json
            git push
          fi

      # Tells people who asked about new versions for their iPod. A failure
      # here is shown on the run but never stops the site from publishing.
      - name: Email release alerts
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          if [ -n "$TEST_ALERT" ]; then
            node scripts/send-alerts.mjs --test "$TEST_ALERT"
          else
            node scripts/send-alerts.mjs "$RUNNER_TEMP/stats-before.json"
          fi

      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
